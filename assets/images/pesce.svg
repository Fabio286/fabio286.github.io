<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Pesce</title>
  <desc id="d">Un pesce arancione con pinne e coda animate</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.55" stop-color="#ff6b2c"/>
      <stop offset="1" stop-color="#ffd0a0"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
  </defs>
  <style>
    .tail { transform-origin: 282px 120px; animation: wag 1.6s ease-in-out infinite; }
    .pect { transform-origin: 152px 135px; animation: flap 1.6s ease-in-out infinite; }
    @keyframes wag  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
    @media (prefers-reduced-motion: reduce) { .tail, .pect { animation: none; } }
  </style>

  <!-- coda -->
  <path class="tail" d="M278 120 C308 92 338 64 366 50 C354 90 354 150 366 190 C338 176 308 148 278 120 Z" fill="url(#fin)"/>

  <!-- pinna dorsale -->
  <path d="M138 70 C165 28 218 26 248 64 C216 58 176 58 138 70 Z" fill="url(#fin)"/>
  <!-- pinna ventrale -->
  <path d="M170 172 C186 206 216 212 232 186 C210 187 190 182 170 172 Z" fill="url(#fin)"/>

  <!-- corpo -->
  <path d="M58 120 C98 48 222 40 292 116 C222 200 98 192 58 120 Z" fill="url(#body)"/>

  <!-- strisce -->
  <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="9" stroke-linecap="round">
    <path d="M168 62 C182 100 182 140 168 178"/>
    <path d="M214 62 C228 100 228 140 214 172"/>
    <path d="M254 82 C262 105 262 128 254 150"/>
  </g>

  <!-- branchia -->
  <path d="M122 92 C108 114 108 132 122 152" fill="none" stroke="#c4440f" stroke-width="3" stroke-linecap="round"/>

  <!-- pinna pettorale -->
  <path class="pect" d="M152 132 C130 150 136 168 168 160 C168 148 162 138 152 132 Z" fill="#ff8a3d" stroke="#c4440f" stroke-width="1.5"/>

  <!-- occhio -->
  <circle cx="92" cy="110" r="11" fill="#fff"/>
  <circle cx="94" cy="110" r="6" fill="#1b1b1b"/>
  <circle cx="96" cy="107" r="2" fill="#fff"/>

  <!-- bocca -->
  <path d="M60 126 C68 130 74 130 80 127" fill="none" stroke="#c4440f" stroke-width="2.5" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
