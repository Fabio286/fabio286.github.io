<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Vallisneria</title>
  <desc id="d">Un ciuffo di vallisneria con lunghe foglie a nastro che ondeggiano lentamente</desc>
  <defs>
    <linearGradient id="leaf" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="20">
      <stop offset="0" stop-color="#14562f"/>
      <stop offset="0.5" stop-color="#2f9a4a"/>
      <stop offset="1" stop-color="#9be07a"/>
    </linearGradient>
    <linearGradient id="leafLight" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="20">
      <stop offset="0" stop-color="#1c6a38"/>
      <stop offset="0.5" stop-color="#47b45c"/>
      <stop offset="1" stop-color="#c2f09a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3cf9f"/>
      <stop offset="1" stop-color="#b79a62"/>
    </linearGradient>
  </defs>
  <style>
    .l { animation: sway 5s ease-in-out infinite; }
    .l1 { transform-origin: 100px 380px; animation-duration: 5.2s; }
    .l2 { transform-origin: 84px 380px;  animation-duration: 6.1s; animation-delay: -1.3s; }
    .l3 { transform-origin: 116px 380px; animation-duration: 5.6s; animation-delay: -2.4s; }
    .l4 { transform-origin: 72px 380px;  animation-duration: 4.6s; animation-delay: -0.7s; }
    .l5 { transform-origin: 132px 380px; animation-duration: 4.9s; animation-delay: -3.1s; }
    @keyframes sway {
      0%, 100% { transform: rotate(-3.5deg) skewX(2.5deg); }
      50%      { transform: rotate(3.5deg)  skewX(-2.5deg); }
    }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; } }
  </style>

  <!-- foglie dietro (più chiare) -->
  <path class="l l4" fill="url(#leafLight)" d="M66 380 C48 340 66 310 46 270 C36 244 44 224 38 200 C52 226 54 246 62 272 C76 312 56 344 78 380 Z"/>
  <path class="l l5" fill="url(#leafLight)" d="M126 380 C146 340 128 310 150 270 C160 244 152 224 160 196 C170 226 164 248 156 274 C146 312 160 344 138 380 Z"/>

  <!-- foglie principali -->
  <path class="l l2" fill="url(#leaf)" d="M78 380 C58 320 88 270 62 210 C48 170 60 130 52 84 C66 130 70 170 82 214 C98 272 74 322 90 380 Z"/>
  <path class="l l3" fill="url(#leaf)" d="M110 380 C130 320 104 270 132 210 C148 168 138 130 148 90 C158 132 150 170 142 214 C128 274 134 322 122 380 Z"/>
  <path class="l l1" fill="url(#leaf)" d="M94 380 C82 310 116 250 94 180 C82 130 96 80 100 20 C106 80 94 132 106 182 C128 250 96 312 106 380 Z"/>

  <!-- sabbia -->
  <path d="M10 382 C50 364 150 364 190 382 L190 396 C150 400 50 400 10 396 Z" fill="url(#sand)"/>
  <g fill="#9a7f4c" fill-opacity=".5">
    <circle cx="48" cy="384" r="2"/><circle cx="82" cy="378" r="1.6"/><circle cx="118" cy="383" r="2"/>
    <circle cx="152" cy="380" r="1.8"/><circle cx="100" cy="390" r="1.5"/><circle cx="68" cy="392" r="1.4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
