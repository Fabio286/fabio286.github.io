<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Pianta a stelo</title>
  <desc id="d">Una pianta d'acquario a stelo con foglie opposte che si rimpiccioliscono verso la cima, con lieve ondeggiamento</desc>
  <defs>
    <!-- foglia ovale con nervatura, rivolta verso destra -->
    <g id="leaf">
      <path d="M0 0 C10 -15 34 -15 46 0 C34 15 10 15 0 0 Z"/>
      <path d="M2 0 L40 0" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3cf9f"/>
      <stop offset="1" stop-color="#b79a62"/>
    </linearGradient>
  </defs>
  <style>
    .plant { transform-origin: 100px 380px; animation: sway 7s ease-in-out infinite; }
    .f { transform-origin: 0 0; animation: flutter 3.6s ease-in-out infinite; }
    .f:nth-of-type(2n)   { animation-delay: -1.2s; }
    .f:nth-of-type(3n)   { animation-delay: -2.1s; animation-duration: 4.3s; }
    @keyframes sway    { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes flutter { 0%,100% { transform: rotate(-3deg); }   50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .plant, .f { animation: none; } }
  </style>

  <g class="plant">
    <!-- stelo -->
    <path d="M100 384 C98 300 102 220 100 150 C99 110 101 70 100 38" fill="none" stroke="#4f8a3a" stroke-width="4.5" stroke-linecap="round"/>

    <!-- coppie di foglie, dalla base alla cima -->
    <g transform="translate(100 332) rotate(-22) scale(1.25)"><use class="f" href="#leaf" fill="#2a7f45"/></g>
    <g transform="translate(100 332) scale(-1 1) rotate(-22) scale(1.25)"><use class="f" href="#leaf" fill="#2a7f45"/></g>

    <g transform="translate(100 298) rotate(-26) scale(1.15)"><use class="f" href="#leaf" fill="#2f8a4a"/></g>
    <g transform="translate(100 298) scale(-1 1) rotate(-26) scale(1.15)"><use class="f" href="#leaf" fill="#2f8a4a"/></g>

    <g transform="translate(100 264) rotate(-30) scale(1.05)"><use class="f" href="#leaf" fill="#3b9650"/></g>
    <g transform="translate(100 264) scale(-1 1) rotate(-30) scale(1.05)"><use class="f" href="#leaf" fill="#3b9650"/></g>

    <g transform="translate(100 230) rotate(-34) scale(.95)"><use class="f" href="#leaf" fill="#4aa557"/></g>
    <g transform="translate(100 230) scale(-1 1) rotate(-34) scale(.95)"><use class="f" href="#leaf" fill="#4aa557"/></g>

    <g transform="translate(100 198) rotate(-38) scale(.85)"><use class="f" href="#leaf" fill="#5db463"/></g>
    <g transform="translate(100 198) scale(-1 1) rotate(-38) scale(.85)"><use class="f" href="#leaf" fill="#5db463"/></g>

    <g transform="translate(100 168) rotate(-42) scale(.75)"><use class="f" href="#leaf" fill="#72c46c"/></g>
    <g transform="translate(100 168) scale(-1 1) rotate(-42) scale(.75)"><use class="f" href="#leaf" fill="#72c46c"/></g>

    <g transform="translate(100 140) rotate(-46) scale(.65)"><use class="f" href="#leaf" fill="#88d072"/></g>
    <g transform="translate(100 140) scale(-1 1) rotate(-46) scale(.65)"><use class="f" href="#leaf" fill="#88d072"/></g>

    <g transform="translate(100 114) rotate(-50) scale(.55)"><use class="f" href="#leaf" fill="#a0dc7c"/></g>
    <g transform="translate(100 114) scale(-1 1) rotate(-50) scale(.55)"><use class="f" href="#leaf" fill="#a0dc7c"/></g>

    <g transform="translate(100 90) rotate(-55) scale(.45)"><use class="f" href="#leaf" fill="#b6e68a"/></g>
    <g transform="translate(100 90) scale(-1 1) rotate(-55) scale(.45)"><use class="f" href="#leaf" fill="#b6e68a"/></g>

    <g transform="translate(100 68) rotate(-62) scale(.36)"><use class="f" href="#leaf" fill="#c9f09a"/></g>
    <g transform="translate(100 68) scale(-1 1) rotate(-62) scale(.36)"><use class="f" href="#leaf" fill="#c9f09a"/></g>

    <!-- gemma apicale -->
    <path d="M100 52 C95 44 96 34 100 26 C104 34 105 44 100 52 Z" fill="#d6f5a8"/>
  </g>

  <!-- radici -->
  <g fill="none" stroke="#d9c9a4" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".9">
    <path d="M98 384 C92 392 88 396 82 398"/>
    <path d="M100 385 C100 392 100 396 101 399"/>
    <path d="M102 384 C108 392 112 396 118 398"/>
  </g>

  <!-- sabbia -->
  <path d="M10 382 C50 364 150 364 190 382 L190 396 C150 400 50 400 10 396 Z" fill="url(#sand)"/>
  <g fill="#9a7f4c" fill-opacity=".5">
    <circle cx="48" cy="384" r="2"/><circle cx="82" cy="378" r="1.6"/><circle cx="124" cy="383" r="2"/>
    <circle cx="152" cy="380" r="1.8"/><circle cx="68" cy="392" r="1.4"/><circle cx="136" cy="391" r="1.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
