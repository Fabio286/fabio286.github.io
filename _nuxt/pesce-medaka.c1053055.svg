<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Medaka</title>
  <desc id="d">Un medaka arancione (himedaka) con dorso piatto, grandi occhi, bocca rivolta verso l'alto e pinna anale lunga</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a12"/>
      <stop offset="0.45" stop-color="#ff9d33"/>
      <stop offset="1" stop-color="#ffe3b0"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb259" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe2b8" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff2c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tail { transform-origin: 298px 101px; animation: wag 1.3s ease-in-out infinite; }
    .pect { transform-origin: 114px 110px; animation: flap 1.3s ease-in-out infinite; }
    .anal { transform-origin: 170px 134px; animation: ripple 1.3s ease-in-out infinite; }
    @keyframes wag    { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes flap   { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
    @keyframes ripple { 0%,100% { transform: skewX(0); } 50% { transform: skewX(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .tail, .pect, .anal { animation: none; } }
  </style>

  <!-- coda a ventaglio -->
  <g class="tail">
    <path d="M298 101 C316 84 338 76 354 82 C361 96 361 106 354 120 C338 126 316 118 298 101 Z" fill="url(#fin)"/>
    <g stroke="#ff8a1f" stroke-opacity=".55" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M302 99 L352 86"/>
      <path d="M302 101 L358 101"/>
      <path d="M302 103 L352 116"/>
    </g>
  </g>

  <!-- pinna dorsale (arretrata, tipica del medaka) -->
  <path d="M230 82 C236 64 256 62 268 88 Z" fill="url(#fin)"/>

  <!-- pinna anale lunga -->
  <path class="anal" d="M168 134 C190 160 252 158 284 112 C250 123 206 131 168 134 Z" fill="url(#fin)"/>

  <!-- pinna ventrale -->
  <path d="M138 136 C140 150 152 156 160 148 C156 144 150 140 146 136 Z" fill="url(#fin)"/>

  <!-- corpo: dorso piatto, ventre arrotondato -->
  <path d="M50 98 C56 84 80 76 120 76 C190 76 260 82 300 94 L300 108 C260 124 200 138 130 138 C84 138 56 120 50 98 Z" fill="url(#body)"/>

  <!-- riflesso dorato lungo il dorso -->
  <path d="M84 80 C150 76 230 80 288 92" fill="none" stroke="url(#sheen)" stroke-width="5" stroke-linecap="round"/>

  <!-- branchia -->
  <path d="M110 84 C102 98 102 114 112 128" fill="none" stroke="#c4600f" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- pinna pettorale -->
  <path class="pect" d="M114 110 C98 120 102 134 130 128 C126 120 122 114 114 110 Z" fill="#ffd9a0" fill-opacity=".85" stroke="#ff9d33" stroke-width="1"/>

  <!-- occhio grande, alto sulla testa -->
  <circle cx="82" cy="92" r="13" fill="#fff4dc"/>
  <circle cx="83" cy="92" r="10" fill="#1b1209"/>
  <circle cx="83" cy="92" r="10" fill="none" stroke="#e8a317" stroke-width="1.5"/>
  <circle cx="87" cy="88" r="3" fill="#fff"/>

  <!-- bocca rivolta verso l'alto -->
  <path d="M51 97 C55 92 59 91 64 93" fill="none" stroke="#c4600f" stroke-width="2.2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
