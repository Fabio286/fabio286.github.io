<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Gourami</title>
  <desc id="d">Un gourami nano con strisce oblique rosse e blu, pinne dorsale e anale lunghe e due filamenti ventrali sottili</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fd0"/>
      <stop offset="0.55" stop-color="#4fc3e6"/>
      <stop offset="1" stop-color="#bdeefa"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3a" stop-opacity=".9"/>
      <stop offset="0.6" stop-color="#ff8a5a" stop-opacity=".65"/>
      <stop offset="1" stop-color="#7fd0f0" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e8fbff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M56 120 C68 82 130 60 200 62 C262 64 302 90 314 114 C302 142 262 170 200 172 C130 174 70 154 56 120 Z"/>
    </clipPath>
  </defs>
  <style>
    .tail    { transform-origin: 312px 114px; animation: wag 1.5s ease-in-out infinite; }
    .pect    { transform-origin: 122px 124px; animation: flap .9s ease-in-out infinite; }
    .feel1   { transform-origin: 138px 162px; animation: sway 2.6s ease-in-out infinite; }
    .feel2   { transform-origin: 146px 164px; animation: sway 2.6s ease-in-out infinite .4s; }
    .longfin { transform-origin: 200px 114px; animation: ripple 1.5s ease-in-out infinite; }
    @keyframes wag    { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes flap   { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-16deg); } }
    @keyframes sway   { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
    @keyframes ripple { 0%,100% { transform: skewX(0); } 50% { transform: skewX(-3deg); } }
    @media (prefers-reduced-motion: reduce) { .tail, .pect, .feel1, .feel2, .longfin { animation: none; } }
  </style>

  <!-- coda arrotondata -->
  <path class="tail" d="M310 114 C330 94 352 96 364 114 C352 132 330 134 310 114 Z" fill="url(#fin)"/>

  <!-- pinne dorsale e anale lunghe -->
  <g class="longfin">
    <path d="M170 63 C212 36 276 50 312 108 C272 84 222 70 170 63 Z" fill="url(#fin)"/>
    <path d="M120 158 C160 206 256 212 312 120 C272 152 192 168 120 158 Z" fill="url(#fin)"/>
    <g stroke="#2f7bff" stroke-opacity=".5" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M200 66 C214 54 236 52 252 62"/>
      <path d="M165 164 C190 190 230 192 262 170"/>
    </g>
  </g>

  <!-- filamenti ventrali -->
  <g fill="none" stroke="#ff6a3a" stroke-linecap="round">
    <path class="feel1" d="M138 162 C132 192 112 214 90 236" stroke-width="2.6"/>
    <path class="feel2" d="M146 164 C142 194 128 218 110 240" stroke-width="2.2"/>
  </g>

  <!-- corpo -->
  <path d="M56 120 C68 82 130 60 200 62 C262 64 302 90 314 114 C302 142 262 170 200 172 C130 174 70 154 56 120 Z" fill="url(#body)"/>

  <!-- strisce oblique rosse e blu -->
  <g clip-path="url(#bodyClip)" fill="none" stroke-linecap="butt">
    <g stroke="#ff4a2e" stroke-width="12" stroke-opacity=".9">
      <path d="M150 50 L126 184"/>
      <path d="M198 50 L174 184"/>
      <path d="M246 50 L222 184"/>
      <path d="M294 50 L270 184"/>
    </g>
    <g stroke="#1558d6" stroke-width="5" stroke-opacity=".8">
      <path d="M174 50 L150 184"/>
      <path d="M222 50 L198 184"/>
      <path d="M270 50 L246 184"/>
    </g>
  </g>

  <!-- riflesso sul dorso -->
  <path d="M92 76 C150 64 232 66 296 92" fill="none" stroke="url(#sheen)" stroke-width="5" stroke-linecap="round"/>

  <!-- branchia -->
  <path d="M112 86 C102 108 102 134 114 156" fill="none" stroke="#0e5f8f" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- pinna pettorale -->
  <path class="pect" d="M122 124 C104 134 108 150 136 144 C134 136 130 128 122 124 Z" fill="#bdeefa" fill-opacity=".75" stroke="#4fc3e6" stroke-width="1"/>

  <!-- occhio -->
  <circle cx="90" cy="104" r="12" fill="#fff6ec"/>
  <circle cx="91" cy="104" r="9" fill="#1a0f12"/>
  <circle cx="91" cy="104" r="9" fill="none" stroke="#ff5a3a" stroke-width="2"/>
  <circle cx="95" cy="100" r="2.6" fill="#fff"/>

  <!-- bocca -->
  <path d="M57 122 C62 126 68 126 73 123" fill="none" stroke="#0e5f8f" stroke-width="2.2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
