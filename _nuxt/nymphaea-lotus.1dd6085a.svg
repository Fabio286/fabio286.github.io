<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Nymphaea lotus</title>
  <desc id="d">Una pianta d'acquario a foglia larga tipo Nymphaea lotus, con foglie rosso-verdi dai bordi ondulati su lunghi piccioli che partono da un bulbo</desc>
  <defs>
    <!-- foglia: origine nel punto di attacco del picciolo, lobo in alto -->
    <g id="leaf">
      <path d="M0 0 L-10 18 C-24 24 -48 24 -60 0 C-70 -22 -58 -50 -30 -61 C-12 -67 12 -67 30 -61 C58 -50 70 -22 60 0 C48 24 24 24 10 18 Z"/>
      <g stroke="#f1e3b0" stroke-opacity=".38" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M0 0 L-52 -10"/><path d="M0 0 L-56 -34"/><path d="M0 0 L-38 -54"/><path d="M0 0 L-16 -62"/>
        <path d="M0 0 L0 -64"/>
        <path d="M0 0 L16 -62"/><path d="M0 0 L38 -54"/><path d="M0 0 L56 -34"/><path d="M0 0 L52 -10"/>
        <path d="M0 0 L-40 14"/><path d="M0 0 L40 14"/>
      </g>
      <g fill="#2f0f10" fill-opacity=".22">
        <circle cx="-30" cy="-20" r="4"/><circle cx="22" cy="-30" r="5"/><circle cx="-12" cy="-46" r="3.5"/>
        <circle cx="38" cy="-10" r="3"/><circle cx="-44" cy="-38" r="3"/><circle cx="8" cy="-10" r="3.5"/>
        <circle cx="-22" cy="6" r="3"/><circle cx="26" cy="8" r="2.6"/><circle cx="2" cy="-56" r="2.6"/>
      </g>
    </g>

    <!-- bordi ondulati (semi diversi per variare le foglie) -->
    <filter id="r1" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="r2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="r3" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <radialGradient id="red" cx=".5" cy=".95" r=".95">
      <stop offset="0" stop-color="#7a2326"/>
      <stop offset=".5" stop-color="#9a4a2c"/>
      <stop offset="1" stop-color="#5a8a36"/>
    </radialGradient>
    <radialGradient id="green" cx=".5" cy=".95" r=".95">
      <stop offset="0" stop-color="#5a5a2a"/>
      <stop offset=".5" stop-color="#4f8a3a"/>
      <stop offset="1" stop-color="#7fc060"/>
    </radialGradient>
    <radialGradient id="young" cx=".5" cy=".95" r=".95">
      <stop offset="0" stop-color="#a02a30"/>
      <stop offset="1" stop-color="#d0705a"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3cf9f"/>
      <stop offset="1" stop-color="#b79a62"/>
    </linearGradient>
  </defs>
  <style>
    .plant { transform-origin: 150px 380px; animation: sway 8s ease-in-out infinite; }
    .f { transform-origin: 0 0; animation: flutter 4.6s ease-in-out infinite; }
    .f2 { animation-duration: 5.4s; animation-delay: -1.6s; }
    .f3 { animation-duration: 4.1s; animation-delay: -2.8s; }
    @keyframes sway    { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes flutter { 0%,100% { transform: rotate(-3deg); }   50% { transform: rotate(3.5deg); } }
    @media (prefers-reduced-motion: reduce) { .plant, .f { animation: none; } }
  </style>

  <g class="plant">
    <!-- piccioli -->
    <g fill="none" stroke="#7a7a3a" stroke-width="4" stroke-linecap="round">
      <path d="M150 378 C146 280 154 160 150 88"/>
      <path d="M148 378 C120 340 76 300 62 262"/>
      <path d="M153 378 C186 340 226 300 240 254"/>
      <path d="M150 378 C140 300 100 230 86 152"/>
      <path d="M152 378 C170 300 210 220 216 124"/>
      <path d="M148 378 C140 350 124 330 118 306" stroke-width="3"/>
      <path d="M152 378 C160 354 176 336 186 314" stroke-width="3"/>
    </g>

    <!-- foglie, dal retro al primo piano -->
    <g transform="translate(150 88) rotate(0) scale(1.0)"><use class="f" href="#leaf" fill="url(#green)" filter="url(#r1)"/></g>
    <g transform="translate(62 262) rotate(-20) scale(.8)"><use class="f f2" href="#leaf" fill="url(#green)" filter="url(#r2)"/></g>
    <g transform="translate(240 254) rotate(22) scale(.85)"><use class="f f3" href="#leaf" fill="url(#red)" filter="url(#r3)"/></g>
    <g transform="translate(86 152) rotate(-12) scale(1.25)"><use class="f f3" href="#leaf" fill="url(#red)" filter="url(#r1)"/></g>
    <g transform="translate(216 124) rotate(10) scale(1.3)"><use class="f f2" href="#leaf" fill="url(#red)" filter="url(#r2)"/></g>
    <g transform="translate(118 306) rotate(-8) scale(.45)"><use class="f" href="#leaf" fill="url(#young)" filter="url(#r3)"/></g>
    <g transform="translate(186 314) rotate(10) scale(.4)"><use class="f f2" href="#leaf" fill="url(#young)" filter="url(#r1)"/></g>
  </g>

  <!-- sabbia -->
  <path d="M10 382 C70 364 230 364 290 382 L290 396 C230 400 70 400 10 396 Z" fill="url(#sand)"/>
  <g fill="#9a7f4c" fill-opacity=".5">
    <circle cx="48" cy="386" r="2"/><circle cx="96" cy="378" r="1.6"/><circle cx="204" cy="383" r="2"/>
    <circle cx="246" cy="382" r="1.8"/><circle cx="120" cy="392" r="1.5"/><circle cx="178" cy="391" r="1.4"/>
  </g>

  <!-- bulbo e radici -->
  <g fill="none" stroke="#d9c9a4" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".9">
    <path d="M144 384 C138 392 132 396 124 398"/>
    <path d="M150 386 C150 392 150 396 151 399"/>
    <path d="M156 384 C162 392 168 396 176 398"/>
  </g>
  <ellipse cx="150" cy="376" rx="17" ry="12" fill="#6b4a2e"/>
  <path d="M138 372 C144 366 156 366 162 372" fill="none" stroke="#8a6640" stroke-width="2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
