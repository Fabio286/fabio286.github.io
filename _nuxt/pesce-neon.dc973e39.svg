<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Pesce neon</title>
  <desc id="d">Un pesce stile neon tetra con striscia blu luminosa e ventre rosso, coda animata</desc>
  <defs>
    <!-- dorso trasparente argentato-oliva -->
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5f5a"/>
      <stop offset="0.6" stop-color="#7fa6a0"/>
      <stop offset="1" stop-color="#cfe6e2"/>
    </linearGradient>
    <!-- ventre rosso che sfuma verso la testa -->
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ff2a3d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e0102a"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d5e" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff9aa5" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M48 100 C70 70 130 58 200 62 C250 65 285 85 302 98 L302 104 C285 118 250 138 200 142 C130 146 70 132 48 100 Z"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .tail  { transform-origin: 298px 101px; animation: wag 1.2s ease-in-out infinite; }
    .pect  { transform-origin: 128px 112px; animation: flap 1.2s ease-in-out infinite; }
    .stripe{ animation: pulse 2.4s ease-in-out infinite; }
    @keyframes wag   { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes flap  { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { .tail, .pect, .stripe { animation: none; } }
  </style>

  <!-- coda biforcuta -->
  <path class="tail" d="M298 101 C320 90 340 72 362 60 C354 84 350 98 352 101 C350 104 354 118 362 142 C340 130 320 112 298 101 Z" fill="url(#fin)"/>

  <!-- pinne -->
  <path d="M180 63 C190 42 216 40 228 67 Z" fill="#6f9993" fill-opacity=".8"/>
  <path d="M200 141 C210 164 238 162 250 130 Z" fill="url(#fin)"/>
  <path d="M232 62 C238 56 246 56 250 66 Z" fill="#6f9993" fill-opacity=".6"/>

  <!-- corpo -->
  <path d="M48 100 C70 70 130 58 200 62 C250 65 285 85 302 98 L302 104 C285 118 250 138 200 142 C130 146 70 132 48 100 Z" fill="url(#back)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="110" y="101" width="200" height="60" fill="url(#belly)"/>
  </g>

  <!-- striscia neon -->
  <g class="stripe" filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M96 94 C150 84 230 86 296 98" stroke="#18d4ff" stroke-width="9"/>
    <path d="M100 93.5 C152 84 230 86 292 97.5" stroke="#d8fbff" stroke-width="2.5" stroke-opacity=".9"/>
  </g>

  <!-- branchia -->
  <path d="M112 78 C102 96 102 112 112 128" fill="none" stroke="#2b4a46" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- pinna pettorale -->
  <path class="pect" d="M128 112 C112 124 116 138 144 132 C142 124 136 116 128 112 Z" fill="#cfe6e2" fill-opacity=".7" stroke="#7fa6a0" stroke-width="1"/>

  <!-- occhio -->
  <circle cx="80" cy="97" r="11" fill="#f4fbff"/>
  <circle cx="80" cy="97" r="11" fill="none" stroke="#18d4ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="82" cy="97" r="6" fill="#0b1620"/>
  <circle cx="84" cy="94" r="2" fill="#fff"/>

  <!-- bocca -->
  <path d="M50 102 C56 105 62 105 67 103" fill="none" stroke="#2b4a46" stroke-width="2" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
